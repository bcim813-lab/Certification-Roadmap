<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps · Interactive Hub with Ripple Waves</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            color: #eef2f8;
            padding: 0;
            overflow: hidden;
            background: #070b14;
            height: 100vh;
            cursor: pointer;
        }

        /* ===== CANVAS ===== */
        #mainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            cursor: pointer;
        }

        /* ===== GLOW OVERLAY ===== */
        .glow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 40%, rgba(79, 70, 229, 0.04) 0%, transparent 60%);
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 30px 30px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: none;
        }

        .container>* {
            pointer-events: auto;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 12px;
            backdrop-filter: blur(20px);
            flex-shrink: 0;
            pointer-events: auto;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 4px 25px rgba(79, 70, 229, 0.25);
            animation: brandPulse 3s ease-in-out infinite;
            position: relative;
        }

        .brand-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.3), transparent);
            z-index: -1;
            animation: brandGlow 2s ease-in-out infinite;
        }

        @keyframes brandGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes brandPulse {
            0%, 100% { box-shadow: 0 4px 25px rgba(79, 70, 229, 0.25); }
            50% { box-shadow: 0 4px 60px rgba(79, 70, 229, 0.5); }
        }

        .brand-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-text span {
            background: linear-gradient(135deg, #818cf8, #7c3aed, #a78bfa);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 4s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .brand-sub {
            font-size: 11px;
            color: #5a6a82;
            font-weight: 400;
            -webkit-text-fill-color: #5a6a82;
            display: block;
            margin-top: 1px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.06);
            padding: 5px 14px 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.08);
            position: relative;
            overflow: hidden;
        }

        .live-indicator::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(16, 185, 129, 0.03), transparent, rgba(16, 185, 129, 0.03), transparent);
            animation: spinGlow 4s linear infinite;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulseDot 1.4s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .live-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.2);
            animation: dotRipple 1.4s ease-in-out infinite;
        }

        @keyframes dotRipple {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(2); opacity: 0; }
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .live-label {
            font-size: 9px;
            font-weight: 600;
            color: #10b981;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .clock {
            font-size: 13px;
            font-weight: 500;
            color: #5a6a82;
            font-family: 'Inter', monospace;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .clock::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            animation: clockShine 3s ease-in-out infinite;
        }

        @keyframes clockShine {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        /* ===== HERO ===== */
        .hero {
            margin: 18px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
            backdrop-filter: blur(20px);
            padding: 18px 24px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(129, 140, 248, 0.03), transparent 60%);
            animation: heroGlow 6s ease-in-out infinite;
        }

        @keyframes heroGlow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10%, 10%); }
        }

        .hero-left h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }

        .hero-left h1 span {
            color: #818cf8;
            position: relative;
        }

        .hero-left h1 span::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #818cf8, #7c3aed, #a78bfa);
            background-size: 200% 100%;
            border-radius: 2px;
            animation: lineShine 3s ease-in-out infinite;
        }

        @keyframes lineShine {
            0%, 100% { background-position: 200% 0; }
            50% { background-position: -200% 0; }
        }

        .hero-left p {
            font-size: 13px;
            color: #5a6a82;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .hero-right {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #8a9bb5;
            transition: all 0.4s;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .hero-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: left 0.5s;
        }

        .hero-badge:hover::before {
            left: 100%;
        }

        .hero-badge:hover {
            border-color: rgba(129, 140, 248, 0.15);
            background: rgba(129, 140, 248, 0.03);
            transform: translateY(-2px);
        }

        .hero-badge strong {
            color: #eef2f8;
        }

        /* ===== MAIN GRID ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            flex: 1;
            min-height: 0;
        }

        /* ===== LEFT PANEL ===== */
        .left-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            transition: all 0.4s;
            position: relative;
            pointer-events: auto;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 0% 0%, rgba(129, 140, 248, 0.03), transparent);
            pointer-events: none;
        }

        .left-panel:hover {
            border-color: rgba(255, 255, 255, 0.06);
        }

        .panel-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .panel-header .title {
            font-size: 11px;
            font-weight: 600;
            color: #8a9bb5;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .panel-header .count {
            font-size: 11px;
            color: #5a6a82;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 12px;
            animation: countPulse 2s ease-in-out infinite;
        }

        @keyframes countPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .cert-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px 12px;
            position: relative;
            z-index: 1;
        }

        .cert-list::-webkit-scrollbar {
            width: 3px;
        }
        .cert-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .cert-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
        }

        .cert-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            margin-bottom: 4px;
            position: relative;
            overflow: hidden;
        }

        .cert-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(180deg, #818cf8, #7c3aed, #a78bfa);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .cert-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.03), transparent);
            transition: left 0.6s;
        }

        .cert-item:hover::after {
            left: 100%;
        }

        .cert-item.active::before {
            opacity: 1;
        }

        .cert-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .cert-item.active {
            background: rgba(129, 140, 248, 0.06);
            border-color: rgba(129, 140, 248, 0.12);
            box-shadow: 0 0 40px rgba(129, 140, 248, 0.04);
        }

        .cert-item .icon-wrap {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 18px;
            flex-shrink: 0;
            transition: all 0.4s;
            position: relative;
            z-index: 1;
        }

        .cert-item.active .icon-wrap {
            background: rgba(129, 140, 248, 0.08);
            transform: scale(1.05);
        }

        .cert-item .info {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .cert-item .info .name {
            font-size: 12px;
            font-weight: 600;
            color: #eef2f8;
            line-height: 1.2;
            transition: color 0.3s;
        }

        .cert-item.active .info .name {
            color: #818cf8;
        }

        .cert-item .info .provider {
            font-size: 10px;
            color: #5a6a82;
            margin-top: 1px;
        }

        .cert-item .step-tag {
            font-size: 8px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: #5a6a82;
            flex-shrink: 0;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .cert-item .step-tag.active-step {
            background: rgba(129, 140, 248, 0.12);
            color: #818cf8;
            animation: tagPulse 2s ease-in-out infinite;
        }

        @keyframes tagPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .cert-item .chevron {
            color: #2a2a3a;
            font-size: 12px;
            transition: all 0.4s;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .cert-item.active .chevron {
            color: #818cf8;
            transform: translateX(6px);
        }

        /* ===== RIGHT PANEL ===== */
        .right-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 0;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.4s;
            position: relative;
            pointer-events: auto;
        }

        .right-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.03), transparent);
            pointer-events: none;
        }

        .right-panel:hover {
            border-color: rgba(255, 255, 255, 0.06);
        }

        /* ===== PATH HEADER ===== */
        .path-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255, 255, 255, 0.01);
            position: relative;
            z-index: 1;
        }

        .path-header .left .title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .path-header .left .title .icon {
            font-size: 22px;
            animation: iconFloat 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(-3deg); }
            75% { transform: translateY(-4px) rotate(3deg); }
        }

        .path-header .left .title .name {
            color: #eef2f8;
            position: relative;
        }

        .path-header .left .title .name::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, #818cf8, transparent);
            transition: width 0.6s;
        }

        .path-header:hover .left .title .name::after {
            width: 100%;
        }

        .path-header .left .sub {
            font-size: 12px;
            color: #5a6a82;
            margin-top: 2px;
        }

        .path-header .right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .path-tag {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 12px;
            white-space: nowrap;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .path-tag::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.03), transparent, rgba(255, 255, 255, 0.03), transparent);
            animation: tagSpin 4s linear infinite;
        }

        @keyframes tagSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .path-tag.easy { background: rgba(16, 185, 129, 0.12); color: #10b981; }
        .path-tag.medium { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
        .path-tag.hard { background: rgba(239, 68, 68, 0.12); color: #ef4444; }
        .path-tag.expert { background: rgba(168, 85, 247, 0.12); color: #a78bfa; }
        .path-tag.time { background: rgba(99, 102, 241, 0.12); color: #818cf8; }

        .path-tag:hover {
            transform: scale(1.05) translateY(-1px);
        }

        /* ===== PROGRESS SECTION ===== */
        .progress-section {
            padding: 12px 24px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 1;
        }

        .progress-section .info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #5a6a82;
            margin-bottom: 6px;
        }

        .progress-section .info .done {
            color: #10b981;
            font-weight: 600;
        }

        .progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-track::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: trackShine 2s ease-in-out infinite;
        }

        @keyframes trackShine {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .progress-track .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #818cf8, #7c3aed, #a78bfa, #7c3aed, #818cf8);
            width: 0%;
            transition: width 1s ease;
            background-size: 300% 100%;
            animation: progressFlow 3s linear infinite;
            position: relative;
        }

        @keyframes progressFlow {
            0% { background-position: 300% 0; }
            100% { background-position: -300% 0; }
        }

        /* ===== PATH CONTENT ===== */
        .path-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 24px;
            position: relative;
            z-index: 1;
        }

        .path-content::-webkit-scrollbar {
            width: 3px;
        }
        .path-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .path-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
        }

        .path-step {
            display: flex;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .path-step::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.03), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .path-step:hover::before {
            opacity: 1;
        }

        .path-step:hover {
            border-color: rgba(129, 140, 248, 0.08);
            transform: translateX(4px);
            box-shadow: 0 4px 30px rgba(129, 140, 248, 0.03);
        }

        .path-step .num {
            font-size: 11px;
            font-weight: 700;
            color: #5a6a82;
            min-width: 26px;
            text-align: center;
            padding-top: 2px;
            position: relative;
            z-index: 1;
            transition: color 0.3s;
        }

        .path-step:hover .num {
            color: #818cf8;
        }

        .path-step .body {
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .path-step .body .title {
            font-size: 13px;
            font-weight: 600;
            color: #eef2f8;
            transition: color 0.3s;
        }

        .path-step:hover .body .title {
            color: #a78bfa;
        }

        .path-step .body .desc {
            font-size: 12px;
            color: #8a9bb5;
            margin-top: 3px;
            line-height: 1.6;
        }

        .path-step .body .links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .path-step .body .links a {
            font-size: 10px;
            color: #818cf8;
            text-decoration: none;
            padding: 3px 14px;
            border-radius: 12px;
            background: rgba(129, 140, 248, 0.05);
            border: 1px solid rgba(129, 140, 248, 0.06);
            transition: all 0.4s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            overflow: hidden;
        }

        .path-step .body .links a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.08), transparent);
            transition: left 0.4s;
        }

        .path-step .body .links a:hover::before {
            left: 100%;
        }

        .path-step .body .links a:hover {
            background: rgba(129, 140, 248, 0.1);
            border-color: rgba(129, 140, 248, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(129, 140, 248, 0.1);
        }

        .path-step .body .links a .link-icon {
            font-size: 9px;
        }

        .path-step .status-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 10px;
            flex-shrink: 0;
            align-self: flex-start;
            white-space: nowrap;
            position: relative;
            z-index: 1;
            transition: all 0.3s;
        }

        .path-step:hover .status-badge {
            transform: scale(1.05);
        }

        .status-badge.done { background: rgba(16, 185, 129, 0.12); color: #10b981; }
        .status-badge.pending { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
        .status-badge.optional { background: rgba(255, 255, 255, 0.03); color: #5a6a82; }

        /* ===== CLICK HINT ===== */
        .click-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: hintPulse 3s ease-in-out infinite;
            pointer-events: none;
            font-weight: 300;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.15; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.4; transform: translateX(-50%) scale(1.02); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .container { padding: 14px 20px 20px; }
            .main-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .left-panel {
                max-height: 300px;
            }
            .right-panel {
                min-height: 380px;
            }
            .click-hint { display: none; }
        }

        @media (max-width: 768px) {
            .container { padding: 10px 14px 14px; height: 100vh; }
            .topbar { flex-direction: column; align-items: flex-start; gap: 8px; padding-bottom: 12px; }
            .topbar-right { flex-wrap: wrap; }
            .brand-text { font-size: 16px; }
            .hero { flex-direction: column; align-items: flex-start; padding: 14px 16px; margin: 12px 0 14px; }
            .hero-left h1 { font-size: 20px; }
            .hero-right { flex-wrap: wrap; }
            .path-header { padding: 14px 16px; flex-direction: column; }
            .path-header .left .title { font-size: 15px; }
            .path-content { padding: 10px 14px; }
            .path-step { padding: 10px 12px; flex-wrap: wrap; }
            .path-step .body .title { font-size: 12px; }
            .path-step .body .desc { font-size: 11px; }
            .cert-item { padding: 8px 10px; }
            .cert-item .info .name { font-size: 11px; }
            .progress-section { padding: 8px 16px; }
            .left-panel { max-height: 260px; }
            .right-panel { min-height: 340px; }
            .click-hint { display: none; }
        }

        @media (max-width: 480px) {
            .container { padding: 8px 8px 10px; }
            .cert-item { padding: 6px 8px; gap: 6px; }
            .cert-item .icon-wrap { width: 28px; height: 28px; font-size: 12px; }
            .cert-item .info .name { font-size: 10px; }
            .cert-item .info .provider { font-size: 8px; }
            .path-header { padding: 10px 12px; }
            .path-header .left .title { font-size: 13px; gap: 6px; }
            .path-content { padding: 8px 10px; }
            .path-step { padding: 8px 10px; gap: 6px; flex-direction: column; }
            .path-step .num { text-align: left; }
            .path-step .body .title { font-size: 11px; }
            .path-step .body .desc { font-size: 10px; }
            .path-step .body .links a { font-size: 8px; padding: 2px 8px; }

            .hero-left p { font-size: 10px; }

            .brand-icon { width: 32px; height: 32px; font-size: 12px; }

            .hero-badge { font-size: 8px; padding: 4px 10px; }
            .panel-header { padding: 10px 12px; }
            .panel-header .title { font-size: 9px; }
            .panel-header .count { font-size: 9px; padding: 1px 8px; }
            .progress-section .info { font-size: 9px; }
            .left-panel { max-height: 200px; }

            .path-tag { font-size: 8px; padding: 2px 10px; }
            .click-hint { display: none; }

</head>
<body>
    <!-- MAIN CANVAS -->
    <canvas id="mainCanvas"></canvas>
    <div class="glow-overlay"></div>

    <!-- CLICK HINT -->
    <div class="click-hint">✦ Click anywhere for ripple waves ✦</div>

    <div class="container">
        <!-- TOP BAR -->
        <div class="topbar">
            <div class="topbar-left">
                <div class="brand-icon">◆</div>
                <div>
                    <div class="brand-text">DevOps<span>Hub</span></div>
                    <span class="brand-sub">Interactive Certification Hub</span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    <span class="live-label">Live</span>
                </div>
                <div class="clock" id="clock">00:00:00</div>
            </div>
        </div>

        <!-- HERO -->
        <div class="hero">
            <div class="hero-left">
                <h1>🎯 <span>Click</span> · Explore · <span>Learn</span></h1>
                <p>Select any certification to see the complete learning path with resources</p>
            </div>
            <div class="hero-right">
                <span class="hero-badge">📚 <strong id="totalCerts">0</strong> Certifications</span>
                <span class="hero-badge">📖 <strong id="totalSteps">0</strong> Learning Steps</span>
                <span class="hero-badge">✅ <strong id="totalDone">0</strong> Completed</span>
            </div>
        </div>

        <!-- MAIN GRID -->
        <div class="main-grid">
            <div class="left-panel">
                <div class="panel-header">
                    <span class="title">📋 Certifications</span>
                    <span class="count" id="certCount">0</span>
                </div>
                <div class="cert-list" id="certList"></div>
            </div>
            <div class="right-panel">
                <div class="path-header" id="pathHeader"></div>
                <div class="progress-section">
                    <div class="info">
                        <span>Progress</span>
                        <span><span class="done" id="doneCount">0</span> / <span id="totalPathSteps">0</span> steps completed</span>
                    </div>
                    <div class="progress-track">
                        <div class="fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="path-content" id="pathContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== MAIN CANVAS WITH RIPPLE WAVES =====
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, angle = 0;

        // ===== RIPPLE SYSTEM =====
        const ripples = [];
        const MAX_RIPPLES = 30;

        // ===== PARTICLE SYSTEMS =====
        const stars = [];
        const particles = [];
        const glowingOrbs = [];
        const sparkles = [];

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ===== STARS =====
        for (let i = 0; i < 350; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                s: Math.random() * 1.8 + 0.3,
                a: Math.random() * 0.5 + 0.1,
                twinkleSpeed: Math.random() * 0.03 + 0.005,
                pulse: Math.random() * Math.PI * 2,
                color: ['#ffffff', '#818cf8', '#a78bfa', '#60a5fa'][Math.floor(Math.random() * 4)]
            });
        }

        // ===== GLOWING ORBS =====
        for (let i = 0; i < 10; i++) {
            glowingOrbs.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 100 + 50,
                a: Math.random() * 0.04 + 0.02,
                vx: (Math.random() - 0.5) * 0.12,
                vy: (Math.random() - 0.5) * 0.12,
                color: ['#818cf8', '#7c3aed', '#60a5fa', '#34d399', '#a78bfa'][Math.floor(Math.random() * 5)],
                pulse: Math.random() * Math.PI * 2,
                pulseSpeed: Math.random() * 0.01 + 0.005
            });
        }

        // ===== FLOATING PARTICLES =====
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.15,
                vy: (Math.random() - 0.5) * 0.15,
                s: Math.random() * 2 + 0.5,
                a: Math.random() * 0.3 + 0.05,
                color: ['#818cf8', '#7c3aed', '#60a5fa', '#34d399', '#a78bfa', '#f59e0b'][Math.floor(Math.random() * 6)],
                pulse: Math.random() * Math.PI * 2,
                pulseSpeed: Math.random() * 0.02 + 0.005
            });
        }

        // ===== SPARKLES =====
        for (let i = 0; i < 40; i++) {
            sparkles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                s: Math.random() * 1.5 + 0.5,
                life: Math.random() * 100 + 50,
                maxLife: Math.random() * 150 + 50,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                color: ['#ffffff', '#818cf8', '#a78bfa'][Math.floor(Math.random() * 3)]
            });
        }

        // ===== RIPPLE CLASS =====
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = Math.max(W, H) * 0.6 + Math.random() * 200;
                this.speed = 2 + Math.random() * 3;
                this.life = 1;
                this.decay = 0.005 + Math.random() * 0.008;
                this.color = ['#818cf8', '#7c3aed', '#60a5fa', '#a78bfa', '#34d399'][Math.floor(Math.random() * 5)];
                this.width = 1.5 + Math.random() * 2;
                this.pulse = Math.random() * Math.PI * 2;
                this.phase = Math.random() * 100;
            }

            update() {
                this.radius += this.speed;
                this.life -= this.decay;
                this.pulse += 0.05;
                this.phase += 0.02;
                return this.life > 0 && this.radius < this.maxRadius;
            }

            draw(ctx) {
                const alpha = this.life * (0.3 + 0.2 * Math.sin(this.pulse));
                const width = this.width * (0.5 + 0.5 * this.life);

                // Main ring
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = width;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15 * this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Inner glow ring
                ctx.globalAlpha = alpha * 0.4;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = width * 2;
                ctx.shadowBlur = 30 * this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.85, 0, Math.PI * 2);
                ctx.stroke();

                // Outer faint ring
                ctx.globalAlpha = alpha * 0.2;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1;
                ctx.shadowBlur = 40 * this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 1.15, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();

                // Glow dots on ring
                if (this.radius > 20 && this.life > 0.3) {
                    const dotCount = 8 + Math.floor(this.radius * 0.02);
                    for (let i = 0; i < dotCount; i++) {
                        const angle2 = (i / dotCount) * Math.PI * 2 + this.phase;
                        const dotX = this.x + Math.cos(angle2) * this.radius;
                        const dotY = this.y + Math.sin(angle2) * this.radius;
                        const dotAlpha = this.life * 0.3 * (0.5 + 0.5 * Math.sin(angle2 + this.pulse));

                        ctx.save();
                        ctx.globalAlpha = dotAlpha;
                        ctx.fillStyle = this.color;
                        ctx.shadowColor = this.color;
                        ctx.shadowBlur = 8;
                        ctx.beginPath();
                        ctx.arc(dotX, dotY, 1.5 + this.life * 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }
        }

        // ===== DRAW FUNCTIONS =====

        function drawDeepSpace() {
            const grad = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, Math.max(W, H) * 0.9);
            grad.addColorStop(0, '#0f1a2e');
            grad.addColorStop(0.3, '#0a0f1e');
            grad.addColorStop(0.6, '#070b14');
            grad.addColorStop(1, '#040810');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Nebula
            const nebula = ctx.createRadialGradient(W * 0.7, H * 0.2, 0, W * 0.7, H * 0.2, W * 0.6);
            nebula.addColorStop(0, 'rgba(79, 70, 229, 0.04)');
            nebula.addColorStop(0.5, 'rgba(129, 140, 248, 0.02)');
            nebula.addColorStop(1, 'transparent');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, W, H);

            const nebula2 = ctx.createRadialGradient(W * 0.2, H * 0.8, 0, W * 0.2, H * 0.8, W * 0.5);
            nebula2.addColorStop(0, 'rgba(16, 185, 129, 0.03)');
            nebula2.addColorStop(0.5, 'rgba(52, 211, 153, 0.015)');
            nebula2.addColorStop(1, 'transparent');
            ctx.fillStyle = nebula2;
            ctx.fillRect(0, 0, W, H);
        }

        function drawGlowingOrbs() {
            glowingOrbs.forEach(orb => {
                orb.x += orb.vx;
                orb.y += orb.vy;
                orb.pulse += orb.pulseSpeed;

                if (orb.x < -orb.r || orb.x > W + orb.r) orb.vx *= -1;
                if (orb.y < -orb.r || orb.y > H + orb.r) orb.vy *= -1;

                const pulseFactor = 1 + 0.1 * Math.sin(orb.pulse);
                const currentR = orb.r * pulseFactor;

                const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, currentR);
                grad.addColorStop(0, orb.color + '20');
                grad.addColorStop(0.3, orb.color + '12');
                grad.addColorStop(0.6, orb.color + '06');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, currentR, 0, Math.PI * 2);
                ctx.fill();

                const innerGrad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, currentR * 0.3);
                innerGrad.addColorStop(0, orb.color + '08');
                innerGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = innerGrad;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, currentR * 0.3, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawStars() {
            stars.forEach(s => {
                s.pulse += s.twinkleSpeed;
                const twinkle = 0.5 + 0.5 * Math.sin(s.pulse);
                ctx.globalAlpha = s.a * twinkle;
                ctx.fillStyle = s.color;
                ctx.shadowColor = s.color;
                ctx.shadowBlur = 3;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;
        }

        function drawParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.pulse += p.pulseSpeed;

                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;

                const alpha = p.a * (0.6 + 0.4 * Math.sin(p.pulse));
                const size = p.s * (1 + 0.3 * Math.sin(p.pulse * 0.5));

                const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 6);
                grad.addColorStop(0, p.color + '25');
                grad.addColorStop(0.4, p.color + '10');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size * 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            });
        }

        function drawConnections() {
            const connectionDistance = 150;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < connectionDistance) {
                        const alpha = (1 - dist / connectionDistance) * 0.06;
                        const pulse = 0.5 + 0.5 * Math.sin(angle * 0.02 + i + j);
                        ctx.strokeStyle = `rgba(129, 140, 248, ${alpha * pulse})`;
                        ctx.lineWidth = 0.5 + 0.5 * pulse;
                        ctx.shadowColor = 'rgba(129, 140, 248, 0.05)';
                        ctx.shadowBlur = 3;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        function drawSparkles() {
            sparkles.forEach(s => {
                s.x += s.vx;
                s.y += s.vy;
                s.life--;

                if (s.life <= 0) {
                    s.x = Math.random() * W;
                    s.y = Math.random() * H;
                    s.life = Math.random() * 150 + 50;
                    s.maxLife = s.life;
                    s.vx = (Math.random() - 0.5) * 0.4;
                    s.vy = (Math.random() - 0.5) * 0.4;
                }

                const lifeRatio = s.life / s.maxLife;
                const alpha = lifeRatio * 0.5;
                const size = s.s * lifeRatio;

                ctx.globalAlpha = alpha;
                ctx.fillStyle = s.color;
                ctx.shadowColor = s.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;
        }

        function drawGrid() {
            const spacing = 70;
            const pulse = 0.5 + 0.5 * Math.sin(angle * 0.01);
            ctx.strokeStyle = `rgba(129, 140, 248, ${0.008 * pulse})`;
            ctx.lineWidth = 0.5;

            const ox = (angle * 0.04) % spacing;
            const oy = (angle * 0.03) % spacing;

            for (let x = -spacing; x < W + spacing; x += spacing) {
                ctx.beginPath();
                ctx.moveTo(x + ox, 0);
                ctx.lineTo(x + ox, H);
                ctx.stroke();
            }
            for (let y = -spacing; y < H + spacing; y += spacing) {
                ctx.beginPath();
                ctx.moveTo(0, y + oy);
                ctx.lineTo(W, y + oy);
                ctx.stroke();
            }
        }

        // ===== DRAW RIPPLES =====
        function drawRipples() {
            ripples.forEach(ripple => ripple.draw(ctx));
        }

        // ===== MAIN ANIMATION =====
        function animate() {
            drawDeepSpace();
            drawGrid();
            drawGlowingOrbs();
            drawStars();
            drawParticles();
            drawConnections();
            drawSparkles();
            drawRipples();

            // Update ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                if (!ripples[i].update()) {
                    ripples.splice(i, 1);
                }
            }

            angle += 0.5;
            requestAnimationFrame(animate);
        }
        animate();

        // ===== CLICK EVENT FOR RIPPLES =====
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Create multiple ripples on click
            const count = 3 + Math.floor(Math.random() * 4);
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * 60;
                const offsetY = (Math.random() - 0.5) * 60;
                const ripple = new Ripple(x + offsetX, y + offsetY);
                ripple.speed = 2 + Math.random() * 3;
                ripple.maxRadius = Math.max(W, H) * 0.5 + Math.random() * 150;
                ripple.color = ['#818cf8', '#7c3aed', '#60a5fa', '#a78bfa', '#34d399', '#f59e0b'][Math.floor(Math.random() * 6)];
                ripples.push(ripple);
            }

            // Limit ripples
            while (ripples.length > MAX_RIPPLES) {
                ripples.shift();
            }
        });

        // ===== RESIZE =====
        window.addEventListener('resize', () => {
            resizeCanvas();
            stars.forEach(s => { s.x = Math.random() * W; s.y = Math.random() * H; });
            particles.forEach(p => { p.x = Math.random() * W; p.y = Math.random() * H; });
            glowingOrbs.forEach(o => { o.x = Math.random() * W; o.y = Math.random() * H; });
            sparkles.forEach(s => { s.x = Math.random() * W; s.y = Math.random() * H; });
        });

        // ===== CLOCK =====
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ===== DATA =====
        const certifications = [{
            id: 1,
            name: 'AWS Cloud Practitioner',
            provider: 'Amazon Web Services · CLF-C02',
            icon: '☁️',
            step: '01',
            difficulty: 'easy',
            difficultyLabel: 'Easy',
            time: '1-2 months',
            description: 'Foundation of AWS Cloud. Understand core services, pricing, and security.',
            path: [

        // ===== RENDER FUNCTIONS =====
        let selectedId = certifications[0].id;

        function renderCertList() {
            const container = document.getElementById('certList');
            container.innerHTML = certifications.map(cert => `
                <div class="cert-item ${selectedId === cert.id ? 'active' : ''}" 
                     onclick="selectCert(${cert.id})">
                    <div class="icon-wrap">${cert.icon}</div>
                    <div class="info">
                        <div class="name">${cert.name}</div>
                        <div class="provider">${cert.provider}</div>
                    </div>
                    <span class="step-tag ${selectedId === cert.id ? 'active-step' : ''}">${cert.step}</span>
                    <span class="chevron">${selectedId === cert.id ? '→' : ''}</span>
                </div>
            `).join('');
            document.getElementById('certCount').textContent = certifications.length;
        }

        function renderPath(certId) {
            const cert = certifications.find(c => c.id === certId);
            if (!cert) return;

            document.getElementById('pathHeader').innerHTML = `
                <div class="left">
                    <div class="title">
                        <span class="icon">${cert.icon}</span>
                        <span class="name">${cert.name}</span>
                    </div>
                    <div class="sub">${cert.provider} · ${cert.description}</div>
                </div>
                <div class="right">
                    <span class="path-tag ${cert.difficulty}">${cert.difficultyLabel}</span>
                    <span class="path-tag time">⏱️ ${cert.time}</span>
                </div>
            `;

            const content = document.getElementById('pathContent');
            const doneCount = cert.path.filter(s => s.status === 'done').length;
            const totalSteps = cert.path.length;

            content.innerHTML = cert.path.map((step, index) => `
                <div class="path-step">
                    <span class="num">${String(index + 1).padStart(2, '0')}</span>
                    <div class="body">
                        <div class="title">${step.title}</div>
                        <div class="desc">${step.desc}</div>
                        ${step.links && step.links.length ? `
                            <div class="links">
                                ${step.links.map(link => `
                                    <a href="${link}" target="_blank">
                                        <span class="link-icon">🔗</span> ${new URL(link).hostname.replace('www.', '')}
                                    </a>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <span class="status-badge ${step.status}">${step.status === 'done' ? '✅ Done' : step.status === 'pending' ? '⏳ Pending' : '○ Optional'}</span>
                </div>
            `).join('');

            const pct = (doneCount / totalSteps) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('doneCount').textContent = doneCount;
            document.getElementById('totalPathSteps').textContent = totalSteps;
            updateHeroStats();
        }

        function updateHeroStats() {
            const totalCerts = certifications.length;
            const totalSteps = certifications.reduce((acc, c) => acc + c.path.length, 0);
            const totalDone = certifications.reduce((acc, c) => acc + c.path.filter(s => s.status === 'done').length, 0);

            document.getElementById('totalCerts').textContent = totalCerts;
            document.getElementById('totalSteps').textContent = totalSteps;
            document.getElementById('totalDone').textContent = totalDone;
        }

        function selectCert(id) {
            selectedId = id;
            renderCertList();
            renderPath(id);
            if (window.innerWidth < 1024) {
                document.querySelector('.right-panel').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // ===== INIT =====
        renderCertList();
        renderPath(selectedId);
        updateHeroStats();
